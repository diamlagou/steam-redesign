{% if owned %}
<a href="{% url 'library' %}" class="btn btn-owned">✓ 已在收藏庫</a>
{% elif user.is_authenticated %}
<form action="{% url 'add_to_library' game.pk %}" method="post" class="inline-form">
    {% csrf_token %}
    <button type="submit" class="btn-buy">加入收藏庫</button>
</form>
{% else %}
<a href="{% url 'login' %}?next={{ request.path }}" class="btn">登入後加入收藏庫</a>
{% endif %}
